<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Snake</title>
  <style>
    :root {
      --bg1: #0a0f1a;
      --bg2: #101827;
      --panel: #131c2d;
      --grid: rgba(95, 255, 170, 0.12);
      --snake: #7ef9a9;
      --snake-head: #d8ffe8;
      --food: #ff6b6b;
      --text: #dfffe9;
      --accent: #7cf7ff;
      --danger: #ff4d6d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(124, 247, 255, 0.08), transparent 30%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
      font-family: "Courier New", monospace;
      letter-spacing: 0.08em;
    }

    .game-shell {
      background: rgba(19, 28, 45, 0.95);
      border: 3px solid rgba(124, 247, 255, 0.7);
      box-shadow:
        0 0 25px rgba(124, 247, 255, 0.15),
        inset 0 0 16px rgba(124, 247, 255, 0.08);
      padding: 18px 18px 14px;
      border-radius: 14px;
      width: min(82vw, 460px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.8rem;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(124, 247, 255, 0.7);
    }

    .score {
      color: var(--snake);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #09131e;
      border: 3px solid rgba(126, 249, 169, 0.5);
      box-shadow: inset 0 0 18px rgba(126, 249, 169, 0.08);
      image-rendering: pixelated;
      border-radius: 8px;
    }

    .status {
      margin-top: 12px;
      font-size: 0.8rem;
      text-align: center;
      color: var(--text);
      min-height: 1.2em;
      text-transform: uppercase;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <span>Retro Snake</span>
      <span class="score">Score: <span id="score">0</span></span>
    </div>

    <canvas id="game" width="420" height="420"></canvas>
    <div id="status" class="status">Press any arrow key to start</div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const statusEl = document.getElementById("status");

    const tileCount = 21;
    const tileSize = canvas.width / tileCount;

    let snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];

    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 15, y: 10 };
    let score = 0;
    let loopSpeed = 140;
    let lastTime = 0;
    let gameStarted = false;
    let gameOver = false;

    function updateStatus(text) {
      statusEl.textContent = text;
    }

    function randomFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));

      return newFood;
    }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      food = randomFood();
      score = 0;
      scoreEl.textContent = score;
      loopSpeed = 140;
      gameStarted = false;
      gameOver = false;
      updateStatus("Press any arrow key to start");
    }

    function startGame() {
      if (gameOver) {
        resetGame();
      }
      gameStarted = true;
      updateStatus("Running");
    }

    function endGame() {
      gameOver = true;
      updateStatus("Game Over — press Space to restart");
    }

    function setDirection(newDir) {
      const isOpposite =
        newDir.x === -direction.x && newDir.y === -direction.y;

      if (!isOpposite) {
        nextDirection = newDir;
      }
    }

    function update() {
      if (!gameStarted || gameOver) return;

      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const wallHit =
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount;

      const selfHit = snake.some((segment, index) => {
        if (index === snake.length - 1) return false;
        return segment.x === head.x && segment.y === head.y;
      });

      if (wallHit || selfHit) {
        endGame();
        return;
      }

      snake.unshift(head);

      const ateFood =
        head.x === food.x && head.y === food.y;

      if (ateFood) {
        score += 10;
        scoreEl.textContent = score;
        food = randomFood();

        if (score % 50 === 0) {
          loopSpeed = Math.max(70, loopSpeed - 12);
        }
      } else {
        snake.pop();
      }
    }

    function drawGrid() {
      ctx.fillStyle = "#09131e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let x = 0; x < tileCount; x++) {
        for (let y = 0; y < tileCount; y++) {
          ctx.strokeStyle = "rgba(95, 255, 170, 0.12)";
          ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
        }
      }
    }

    function drawFood() {
      ctx.fillStyle = "#ff6b6b";
      ctx.fillRect(
        food.x * tileSize + 4,
        food.y * tileSize + 4,
        tileSize - 8,
        tileSize - 8
      );
    }

    function drawSnake() {
      snake.forEach((segment, index) => {
        const x = segment.x * tileSize;
        const y = segment.y * tileSize;

        if (index === 0) {
          ctx.fillStyle = "#d8ffe8";
          ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
        } else {
          ctx.fillStyle = "#7ef9a9";
          ctx.fillRect(x + 4, y + 4, tileSize - 8, tileSize - 8);
        }
      });
    }

    function draw() {
      drawGrid();
      drawFood();
      drawSnake();
    }

    function gameLoop(timestamp) {
      const delta = timestamp - lastTime;

      if (delta >= loopSpeed) {
        update();
        lastTime = timestamp;
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (key === " " && gameOver) {
        resetGame();
        startGame();
        return;
      }

      if (!gameStarted && !gameOver) {
        if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(key)) {
          startGame();
        }
      }

      switch (key) {
        case "arrowup":
        case "w":
          setDirection({ x: 0, y: -1 });
          break;
        case "arrowdown":
        case "s":
          setDirection({ x: 0, y: 1 });
          break;
        case "arrowleft":
        case "a":
          setDirection({ x: -1, y: 0 });
          break;
        case "arrowright":
        case "d":
          setDirection({ x: 1, y: 0 });
          break;
      }
    });

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
